name: Release desktop installers
run-name: ${{ github.ref_type == 'tag' && format('Release {0}', github.ref_name) || 'Warm release Rust cache' }}

on:
  push:
    branches: [main]
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
    paths:
      - .github/workflows/release.yml
      - src-tauri/Cargo.toml
      - src-tauri/Cargo.lock
      - 'rust-toolchain*'
      - '.cargo/config*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-15-intel
            target: aarch64-apple-darwin
            bundle: dmg
            extension: dmg
            artifact: macos-apple-silicon
          - name: Windows x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            bundle: nsis
            extension: exe
            artifact: windows-x64
    env:
      TARGET: ${{ matrix.target }}
      BUNDLE: ${{ matrix.bundle }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Verify release version
        if: github.ref_type == 'tag'
        shell: bash
        run: npm run version:check -- "$GITHUB_REF_NAME"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Rust cache
        id: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
          # Release tags can restore main's cache, but cannot share caches with each other.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install npm dependencies
        if: github.ref_type == 'tag' || steps.rust-cache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Warm release Rust cache
        if: github.ref == 'refs/heads/main' && steps.rust-cache.outputs.cache-hit != 'true'
        shell: bash
        run: npm run tauri build -- --ci --target "$TARGET" --no-bundle -- --locked
      - name: Build installer
        if: github.ref_type == 'tag'
        shell: bash
        run: npm run tauri build -- --ci --target "$TARGET" --bundles "$BUNDLE" -- --locked
      - name: Verify Apple Silicon executable
        if: github.ref_type == 'tag' && runner.os == 'macOS'
        shell: bash
        run: |
          executable="src-tauri/target/$TARGET/release/cloud-session-tray"
          architectures=$(lipo "$executable" -archs)
          test "$architectures" = arm64
      - uses: actions/upload-artifact@v6
        if: github.ref_type == 'tag'
        with:
          name: ${{ matrix.artifact }}-installer
          path: src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.bundle }}/*.${{ matrix.extension }}
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: '*-installer'
          path: installers
      - name: Publish both installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          macos=(installers/macos-apple-silicon-installer/*.dmg)
          windows=(installers/windows-x64-installer/*.exe)
          if (( ${#macos[@]} != 1 || ${#windows[@]} != 1 )); then
            echo 'Expected one macOS DMG and one Windows EXE.' >&2
            exit 1
          fi
          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft); then
            if [[ "$draft" == false ]]; then
              gh release view "$GITHUB_REF_NAME" --json url --jq .url
              exit 0
            fi
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --draft
          fi
          gh release upload "$GITHUB_REF_NAME" "${macos[0]}" "${windows[0]}" --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
