name: Release desktop installers
run-name: ${{ github.ref_type == 'tag' && format('Release {0}', github.ref_name) || 'Warm release Rust cache' }}

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-15-intel
            target: aarch64-apple-darwin
            bundle: dmg
            extension: dmg
            artifact: macos-apple-silicon
          - name: Windows x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            bundle: nsis
            extension: exe
            artifact: windows-x64
    env:
      TARGET: ${{ matrix.target }}
      BUNDLE: ${{ matrix.bundle }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Verify release version
        if: github.ref_type == 'tag'
        shell: bash
        run: npm run version:check -- "$GITHUB_REF_NAME"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Rust cache
        id: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
          # Release tags can restore main's cache, but cannot share caches with each other.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install npm dependencies
        if: github.ref_type == 'tag' || steps.rust-cache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Warm release Rust cache
        if: github.ref == 'refs/heads/main' && steps.rust-cache.outputs.cache-hit != 'true'
        shell: bash
        run: npm run tauri build -- --ci --target "$TARGET" --no-bundle -- --locked
      - name: Build installer
        if: github.ref_type == 'tag'
        shell: bash
        run: npm run tauri build -- --ci --target "$TARGET" --bundles "$BUNDLE" -- --locked
      - name: Verify Apple Silicon executable
        if: github.ref_type == 'tag' && runner.os == 'macOS'
        shell: bash
        run: |
          executable="src-tauri/target/$TARGET/release/cloud-session-tray"
          architectures=$(lipo "$executable" -archs)
          test "$architectures" = arm64
      - uses: actions/upload-artifact@v6
        if: github.ref_type == 'tag'
        with:
          name: ${{ matrix.artifact }}-installer
          path: src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.bundle }}/*.${{ matrix.extension }}
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      actions: read
      contents: write
    steps:
      - name: Wait for CI on the release commit
        timeout-minutes: 45
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking main CI for $GITHUB_SHA"
          while true; do
            result=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              -f branch=main -f head_sha="$GITHUB_SHA" --jq '
                [.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch")] |
                if any(.[]; .conclusion == "success") then "success"
                elif any(.[]; .status != "completed") then "pending"
                elif length == 0 then "missing"
                else .[0].conclusion end')
            case "$result" in
              success) break ;;
              pending) sleep 15 ;;
              *) echo "Main CI for $GITHUB_SHA is $result. A successful CI run is required." >&2; exit 1 ;;
            esac
          done
      - uses: actions/download-artifact@v7
        with:
          pattern: '*-installer'
          path: installers
      - name: Publish both installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          macos=(installers/macos-apple-silicon-installer/*.dmg)
          windows=(installers/windows-x64-installer/*.exe)
          if (( ${#macos[@]} != 1 || ${#windows[@]} != 1 )); then
            echo 'Expected one macOS DMG and one Windows EXE.' >&2
            exit 1
          fi
          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft); then
            if [[ "$draft" == false ]]; then
              gh release view "$GITHUB_REF_NAME" --json url --jq .url
              exit 0
            fi
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --draft
          fi
          gh release upload "$GITHUB_REF_NAME" "${macos[0]}" "${windows[0]}" --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
