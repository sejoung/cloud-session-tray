name: Release desktop installers

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-15-intel
            target: aarch64-apple-darwin
            bundle: dmg
            extension: dmg
            artifact: macos-apple-silicon
          - name: Windows x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            bundle: nsis
            extension: exe
            artifact: windows-x64
    env:
      TARGET: ${{ matrix.target }}
      BUNDLE: ${{ matrix.bundle }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Verify release version
        shell: bash
        run: npm run version:check -- "$GITHUB_REF_NAME"
      - name: Install Apple Silicon Rust target
        if: runner.os == 'macOS'
        run: rustup target add "$TARGET"
      - run: npm ci
      - name: Build installer
        shell: bash
        run: npm run tauri build -- --ci --target "$TARGET" --bundles "$BUNDLE" -- --locked
      - name: Verify Apple Silicon executable
        if: runner.os == 'macOS'
        shell: bash
        run: |
          executable="src-tauri/target/$TARGET/release/cloud-session-tray"
          architectures=$(lipo "$executable" -archs)
          test "$architectures" = arm64
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}-installer
          path: src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.bundle }}/*.${{ matrix.extension }}
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: '*-installer'
          path: installers
      - name: Publish both installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          macos=(installers/macos-apple-silicon-installer/*.dmg)
          windows=(installers/windows-x64-installer/*.exe)
          if (( ${#macos[@]} != 1 || ${#windows[@]} != 1 )); then
            echo 'Expected one macOS DMG and one Windows EXE.' >&2
            exit 1
          fi
          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft); then
            if [[ "$draft" == false ]]; then
              gh release view "$GITHUB_REF_NAME" --json url --jq .url
              exit 0
            fi
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --draft
          fi
          gh release upload "$GITHUB_REF_NAME" "${macos[0]}" "${windows[0]}" --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
